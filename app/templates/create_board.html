<!doctype html>
<html class="h-full bg-gray-900">
  <head>
    <title>Create Board</title>
    <script src="https://cdn.jsdelivr.net/npm/@tailwindcss/browser@4"></script>
  </head>

  <body class="h-full">    
    <nav
      class="bg-gray-800 text-white py-3 px-4 flex items-center justify-between"
    >
      <a class="font-bold text-xl tracking-tight" href="/home">Jeopardy</a>
      <div class="flex items-center">
        <a
          class="text-sm px-4 py-2 leading-none rounded-full hover:bg-gray-700"
          href="/new_game"
          >New Game</a
        >
        <a
          class="text-sm px-4 py-2 leading-none rounded-full hover:bg-gray-700"
          href="/create_board"
          >Create Board</a
        >
        <a
          class="text-sm px-4 py-2 leading-none rounded-full hover:bg-gray-700"
          href="/logout"
          >Logout</a
        >
      </div>
    </nav>

    <div class="min-h-screen bg-gray-900 py-12 px-4 sm:px-6 lg:px-8">
      <div class="max-w-4xl mx-auto">
        <div class="bg-gray-800 rounded-lg shadow-xl p-8">
          <h1 class="text-4xl font-bold text-white mb-2">Create Your Board</h1>
          <p class="text-gray-300 mb-8">
            Enter your board title and questions in JSON format
          </p>

          <form method="post" class="space-y-6">
            <div>
              <label
                for="title"
                class="block text-sm font-medium text-gray-200 mb-3"
                >Board Configuration</label
              >
              <textarea
                id="title"
                name="title"
                rows="25"
                class="w-full px-4 py-3 bg-gray-700 border border-gray-600 rounded-lg text-white placeholder-gray-400 focus:outline-none focus:ring-2 focus:ring-indigo-500 font-mono text-sm"
                placeholder="Enter your board configuration..."
              ></textarea>
            </div>

            <button
              type="submit"
              class="w-full bg-indigo-600 hover:bg-indigo-500 text-white font-bold py-3 px-4 rounded-lg transition duration-200"
            >
              Create Board
            </button>
          </form>
        </div>
      </div>
    </div>
  </body>
</html>
