<!doctype html>
<html class="h-full bg-gray-900">
  <head>
    <title>Create Board</title>
    <script src="https://cdn.jsdelivr.net/npm/@tailwindcss/browser@4"></script>
  </head>

  <body class="h-full">
    <nav class="bg-gray-800 text-white py-3 px-4">
      <div class="max-w-6xl mx-auto flex items-center justify-between">
        <div class="flex items-center space-x-4">
          <a class="font-bold text-xl tracking-tight" href="/home">Jeffpardy</a>
          <a
            class="text-sm px-4 py-2 leading-none rounded-full hover:bg-gray-700"
            href="/find_or_create_room"
            >New Game</a
          >
          <a
            class="text-sm px-4 py-2 leading-none rounded-full hover:bg-gray-700"
            href="/create_board"
            >Create Board</a
          >
        </div>
        <div class="flex items-center space-x-4">
          <p class="text-sm">Signed in as {{ username }}</p>
          <a
            class="text-sm px-4 py-2 leading-none rounded-full hover:bg-gray-700"
            href="/logout"
            >Logout</a
          >
        </div>
      </div>
    </nav>

    <div class="min-h-screen bg-gray-900 py-12 px-4 sm:px-6 lg:px-8">
      <div class="max-w-4xl mx-auto">
        <div class="bg-gray-800 rounded-lg shadow-xl p-8">
          <h1 class="text-4xl font-bold text-white mb-2">Create Your Board</h1>
          <p class="text-gray-300 mb-8" required>Enter your board title</p>
          <p class="text-gray-300 mb-8">{{ error }}</p>

          <form method="post" class="space-y-6">
            <div>
              <textarea
                id="title"
                name="title"
                class="w-full px-4 py-3 bg-gray-700 border border-gray-600 rounded-lg text-white placeholder-gray-400 focus:outline-none focus:ring-2 focus:ring-indigo-500 font-mono text-sm"
                placeholder="Enter your board title here..."
              ></textarea>
            </div>

            <button
              type="submit"
              class="w-full bg-indigo-600 hover:bg-indigo-500 text-white font-bold py-3 px-4 rounded-lg transition duration-200"
            >
              Create Board
            </button>
          </form>

          <div class="grid grid-cols-2 gap-4">
            <div class="text-center">
              <h1>Your Saved Boards (not published)</h1>

              <div class="space-y-3">
                {% for board in saved_board_list %}
                <div>
                  <a href="{{ url_for('create', board = board) }}">
                    <button
                      type="button"
                      class="w-full break-words bg-blue-600 hover:bg-blue-500 text-white font-bold py-6 px-4 rounded-lg transition duration-200 text-center"
                    >
                      {{ board }}
                    </button>
                  </a>
                </div>
                {% endfor %}
              </div>
            </div>

            <div class="text-center">
              <h1>Your Published Boards</h1>

              <div class="space-y-3">
                {% for board in published_board_list %}
                <div>
                  <a href="{{ url_for('create', board = board) }}">
                    <button
                      type="button"
                      class="w-full break-words bg-blue-600 hover:bg-blue-500 text-white font-bold py-6 px-4 rounded-lg transition duration-200 text-center"
                    >
                      {{ board }}
                    </button>
                  </a>
                </div>
                {% endfor %}
              </div>
            </div>
          </div>
        </div>
      </div>
    </div>
  </body>
</html>
