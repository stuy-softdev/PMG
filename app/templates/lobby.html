<!doctype html>
<html class="h-full bg-gray-900">
  <head>
    <title>Login</title>
    <script src="https://cdn.jsdelivr.net/npm/@tailwindcss/browser@4"></script>

    <script src="https://cdn.socket.io/4.7.5/socket.io.min.js"></script>

  </head>

  <body class="h-full">

      <h1 class = "font-bold text-xl tracking-tight">Waiting for more players...</h1>
      <h1 class = "font-bold text-xl tracking-tight">There must be three players to start the game.</h1>
      <h1> Room Code: {{room_code}} </h1>

        <table id = "list_of_players" class="bg-gray-100">
          <tr>
            <th>Players</th>
          </tr>

          <tr>
              <td> {{player1}} </td>
          </tr>

          <tr>
              <td> {{player2}} </td>
          </tr>

          <tr>
              <td> {{player3}} </td>
          </tr>

        </table>

        <form action="{{ url_for('new_game') }}" method="get">
          <button id = "start_game_button" type="submit" class="font-semibold text-indigo-400 hover:text-indigo-300" disabled>
            Start the Game!
          </button>
        </form>

    <div id="join_notifications">

    </div>

    <script>
      const socket = io();
      //const lobbyId = "{{ lobby_id }}";
      //const player1 = "{{ player1 }}";
      //const player2 = "{{ player2 }}";
      //const player3 = "{{ player3 }}";
      const lobby_array = ["{{ lobby_id }}", "{{ player1 }}", "{{ player2 }}", "{{ player3 }}"]

      console.log("javascript socket is working")
      //console.log(player1)
      //console.log(player2)
      //console.log(player3)

      socket.on('connect', () => {
        console.log("javascript socket is working join")
        socket.emit('join', { "lobby_array": lobby_array }); //if player joins, call "join" in python with data set as lobbyid
      })

      socket.on('join_notif', (data) => {
        console.log("javascript socket is working joinnotif")
        let username_joined = data['username_joined']
        let lobby_array = data['lobby_array']
        console.log(lobby_array)

        // changes the display of list of players based on the updated lobby array
        document.getElementById("list_of_players").innerHTML = `
            <tr>
              <th>Players</th>
            </tr>

            <tr>
                <td> ` + lobby_array[1] + ` </td>
            </tr>

            <tr>
                <td> ` + lobby_array[2] + ` </td>
            </tr>

            <tr>
                <td> ` + lobby_array[3] + ` </td>
            </tr>
        `;

        // join notification
        document.getElementById("join_notifications").innerHTML += username_joined + " has joined the room! <br>";

        // if there are 3 players in the lobby, the button to start game becomes clickable
        if (!lobby_array.includes("None")){
          console.log("button is clickable now")
          document.getElementById("start_game_button").disabled = false;
        }
      })

    </script>
  </body>
</html>
