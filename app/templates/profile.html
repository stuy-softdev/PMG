<!DOCTYPE html>
<html>


<head>
  <link href="https://unpkg.com/tailwindcss@2.2.19/dist/tailwind.min.css"
  rel="stylesheet">
</head>

<body>

    <div class="flex justify-center items-center">
        <h1> {{username}}'s profile </h1>
        <br>
        <p> {{description}} </p>
    </div> 
    <br>
    <br>
    <div class="flex justify-left items-left">
         <h1> User Statistics </h1>   
         <p> Amount of games {{username}} has played: {{game_count}} </p>
         <br>
         <p> {{username}}'s wins: {{win_count}} </p> 
         <br>
         <p> {{username}}'s loses: {{lose_count}} </p>
    </div>

</body>
</html>
