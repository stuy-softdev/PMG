<!doctype html>
<html>
  <head>
    <title>Game</title>
    <script src="https://cdn.jsdelivr.net/npm/@tailwindcss/browser@4"></script>
    <link rel="stylesheet" href="create.css" />
  </head>

  <body>
    <nav
      class="bg-gray-800 text-white py-3 px-4 flex items-center justify-between"
    >
      <a class="font-bold text-xl tracking-tight" href="/home">My Site</a>
      <div class="flex items-center">
        <a
          class="text-sm px-4 py-2 leading-none rounded-full hover:bg-gray-700"
          href="/home"
          >Home</a
        >
        <a
          class="text-sm px-4 py-2 leading-none rounded-full hover:bg-gray-700"
          href="/create_new"
          >Create New Game</a
        >
        <a
          class="text-sm px-4 py-2 leading-none rounded-full hover:bg-gray-700"
          href="/game"
          >Game</a
        >
      </div>
    </nav>

    <h1>Game</h1>

    <div class="grid grid-cols-6 gap-5">
      <div><button class="button">Category1</button></div>
      <div><button class="button">Category2</button></div>
      <div><button class="button">Category3</button></div>
      <div><button class="button">Category4</button></div>
      <div><button class="button">Category5</button></div>
      <div><button class="button">Category6</button></div>

      {% for row in range(6) %} {% for column in range(6) %}
      <div>
        <a
          href="{{ url_for('edit', board = board, row = row, column = column) }}"
          ><button class="button">{{ board_text[row][column] }}</button></a
        >
      </div>
      {% endfor %} {% endfor %}
    </div>
  </body>
</html>
