<!doctype html>
<html class="h-full bg-gray-900">
  <head>
    <title>Game</title>
    <script src="https://cdn.jsdelivr.net/npm/@tailwindcss/browser@4"></script>
  </head>

  <body class="h-full">
    <nav
      class="bg-gray-800 text-white py-3 px-4 flex items-center justify-between"
    >
      <a class="font-bold text-xl tracking-tight" href="/home">Jeopardy</a>
      <div class="flex items-center">
        <a
          class="text-sm px-4 py-2 leading-none rounded-full hover:bg-gray-700"
          href="/new_game"
          >New Game</a
        >
        <a
          class="text-sm px-4 py-2 leading-none rounded-full hover:bg-gray-700"
          href="/create_board"
          >Create Board</a
        >
        <a
          class="text-sm px-4 py-2 leading-none rounded-full hover:bg-gray-700"
          href="/logout"
          >Logout</a
        >
      </div>
    </nav>
    <div class="min-h-screen bg-gray-900 py-12 px-4 sm:px-6 lg:px-8">
      <div class="max-w-7xl mx-auto">
        <h1 class="text-4xl font-bold text-white mb-8 text-center">Game</h1>

        <div class="grid grid-cols-6 gap-4">
          {% for cat_i in range(6) %}
            <button
              type="button"
              class="w-full bg-blue-600 hover:bg-blue-500 text-white font-bold py-8 px-4 rounded-lg transition duration-200 text-center text-lg"
            >
            {{ board_text[0][cat_i] }}
          </button>
          {% endfor %}

          {% for row in range(1,6) %} {% for column in range(6) %}
          <div>
            <a
              href="{{ url_for('buzzer', board = board, row = row, column = column, player1 = player1, player2 = player2, player3 = player3, temporary = temporary) }}"
            >
              <button
                type="button"
                class="w-full bg-blue-600 hover:bg-blue-500 text-white font-bold py-8 px-4 rounded-lg transition duration-200 text-center text-lg"
              >
                {{ board_point_values[row][column] }}
              </button>
            </a>
          </div>
          {% endfor %} {% endfor %}
        </div>
      </div>
    </div>
  </body>
</html>
