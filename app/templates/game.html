<!doctype html>
<html>
  <head>
    <title>Game</title>
    <script src="https://cdn.jsdelivr.net/npm/@tailwindcss/browser@4"></script>
    <link rel="stylesheet" href="game.css" />
  </head>

  <body>
    <nav
      class="bg-gray-800 text-white py-3 px-4 flex items-center justify-between"
    >
      <a class="font-bold text-xl tracking-tight" href="/home">My Site</a>
      <div class="flex items-center">
        <a
          class="text-sm px-4 py-2 leading-none rounded-full hover:bg-gray-700"
          href="/home"
          >Home</a
        >
        <a
          class="text-sm px-4 py-2 leading-none rounded-full hover:bg-gray-700"
          href="/create_new"
          >Create New Game</a
        >
        <a
          class="text-sm px-4 py-2 leading-none rounded-full hover:bg-gray-700"
          href="/game"
          >Game</a
        >
      </div>
    </nav>

    <h1>Game</h1>

    <div class="grid grid-cols-6 gap-5">
      {% for row in range(6) %} {% for column in range(6) %}
      <div>
        <a
          href="{{ url_for('buzzer', board = board, row = row, column = column, player1 = player1, player2 = player2, player3 = player3, temporary = temporary) }}"
          ><button class="button">
            {{ board_point_values[row][column] }}
          </button></a
        >
      </div>
      {% endfor %} {% endfor %}
    </div>
  </body>
</html>
