<!doctype html>
<html>
  <head>
    <title>Register</title>
    <script src="https://cdn.jsdelivr.net/npm/@tailwindcss/browser@4"></script>
    <link rel="stylesheet" href="register.css" />
  </head>

  <body>
    <nav
      class="bg-gray-800 text-white py-3 px-4 flex items-center justify-between"
    >
      <a class="font-bold text-xl tracking-tight" href="/home">My Site</a>
      <div class="flex items-center">
        <a
          class="text-sm px-4 py-2 leading-none rounded-full hover:bg-gray-700"
          href="/home"
          >Home</a
        >
        <a
          class="text-sm px-4 py-2 leading-none rounded-full hover:bg-gray-700"
          href="/create_new"
          >Create New Game</a
        >
        <a
          class="text-sm px-4 py-2 leading-none rounded-full hover:bg-gray-700"
          href="/game"
          >Game</a
        >
      </div>
    </nav>
    <h1>Register</h1>
    <br />
    <form action="/register" method="POST">
      <h3>Username:</h3>
      <input class="a" type="text" id="username" name="username" required />
      <br />
      <br />
      <h3>Password:</h3>
      <input class="a" type="password" id="password" name="password" required />
      <br />
      <br />
      <input class="b" type="submit" name="sub1" value="Register" />
    </form>
    <br />
    <h5>{{invalid}}</h5>
    <br />
    <div class="login">
      <p>Click the button below to login.</p>
      <a href="{{url_for('login')}}"> <button class="b">Login</button> </a>
    </div>
    <br />
    <br />
  </body>
</html>
