<!doctype html>
<html class="h-full bg-gray-900">
  <head>
    <title>Edit</title>
    <script src="https://cdn.jsdelivr.net/npm/@tailwindcss/browser@4"></script>
  </head>

  <body class="h-full">
    <nav
      class="bg-gray-800 text-white py-3 px-4 flex items-center justify-between"
    >
      <a class="font-bold text-xl tracking-tight" href="/home">Jeopardy</a>
      <div class="flex items-center">
        <a
          class="text-sm px-4 py-2 leading-none rounded-full hover:bg-gray-700"
          href="/new_game"
          >New Game</a
        >
        <a
          class="text-sm px-4 py-2 leading-none rounded-full hover:bg-gray-700"
          href="/create_board"
          >Create Board</a
        >
        <a
          class="text-sm px-4 py-2 leading-none rounded-full hover:bg-gray-700"
          href="/logout"
          >Logout</a
        >
      </div>
    </nav>

    <div class="min-h-screen bg-gray-900 py-12 px-4 sm:px-6 lg:px-8">
      <div class="max-w-2xl mx-auto">
        <div class="bg-gray-800 rounded-lg shadow-xl p-8">
          <h1 class="text-4xl font-bold text-white mb-8">Edit Board</h1>

          {% if row == 0 %}

          <form method="post" class="space-y-6">
            <div>
              <label
                for="title"
                class="block text-sm font-medium text-gray-200 mb-3"
                >Enter Category Name</label
              >
              <input
                type="text"
                id="title"
                name="category"
                placeholder="Enter Category"
                required
                class="w-full px-4 py-2 bg-gray-700 border border-gray-600 rounded-lg text-white placeholder-gray-400 focus:outline-none focus:ring-2 focus:ring-indigo-500"
              />
            </div>
            <button
              type="submit"
              class="w-full bg-indigo-600 hover:bg-indigo-500 text-white font-bold py-3 px-4 rounded-lg transition duration-200"
            >
              Save Category
            </button>
          </form>

          {% else %}

          <form method="post" class="space-y-6">
            <div>
              <label
                for="question"
                class="block text-sm font-medium text-gray-200 mb-2"
                >Question</label
              >
              <input
                type="text"
                id="question"
                name="question"
                placeholder="Enter Question"
                required
                class="w-full px-4 py-2 bg-gray-700 border border-gray-600 rounded-lg text-white placeholder-gray-400 focus:outline-none focus:ring-2 focus:ring-indigo-500"
              />
            </div>

            <div>
              <label
                for="points"
                class="block text-sm font-medium text-gray-200 mb-2"
                >Point Value</label
              >
              <input
                type="text"
                id="points"
                name="points"
                placeholder="Enter Point Value"
                required
                class="w-full px-4 py-2 bg-gray-700 border border-gray-600 rounded-lg text-white placeholder-gray-400 focus:outline-none focus:ring-2 focus:ring-indigo-500"
              />
            </div>

            <div>
              <label
                for="correct"
                class="block text-sm font-medium text-gray-200 mb-2"
                >Correct Answer</label
              >
              <input
                type="text"
                id="correct"
                name="correct"
                placeholder="Enter Correct Answer"
                required
                class="w-full px-4 py-2 bg-gray-700 border border-gray-600 rounded-lg text-white placeholder-gray-400 focus:outline-none focus:ring-2 focus:ring-indigo-500"
              />
            </div>

            <div>
              <label
                for="wrong1"
                class="block text-sm font-medium text-gray-200 mb-2"
                >Incorrect Option 1</label
              >
              <input
                type="text"
                id="wrong1"
                name="wrong1"
                placeholder="Enter Incorrect Option"
                required
                class="w-full px-4 py-2 bg-gray-700 border border-gray-600 rounded-lg text-white placeholder-gray-400 focus:outline-none focus:ring-2 focus:ring-indigo-500"
              />
            </div>

            <div>
              <label
                for="wrong2"
                class="block text-sm font-medium text-gray-200 mb-2"
                >Incorrect Option 2</label
              >
              <input
                type="text"
                id="wrong2"
                name="wrong2"
                placeholder="Enter Incorrect Option"
                class="w-full px-4 py-2 bg-gray-700 border border-gray-600 rounded-lg text-white placeholder-gray-400 focus:outline-none focus:ring-2 focus:ring-indigo-500"
              />
            </div>

            <div>
              <label
                for="wrong3"
                class="block text-sm font-medium text-gray-200 mb-2"
                >Incorrect Option 3</label
              >
              <input
                type="text"
                id="wrong3"
                name="wrong3"
                placeholder="Enter Incorrect Option"
                class="w-full px-4 py-2 bg-gray-700 border border-gray-600 rounded-lg text-white placeholder-gray-400 focus:outline-none focus:ring-2 focus:ring-indigo-500"
              />
            </div>

            <button
              type="submit"
              class="w-full bg-indigo-600 hover:bg-indigo-500 text-white font-bold py-3 px-4 rounded-lg transition duration-200"
            >
              Save Clue
            </button>
          </form>

          {% endif %}
        </div>
      </div>
    </div>
  </body>
</html>
