<!DOCTYPE html>
<html>


  <head>
    <title>Edit</title>
  </head>

  <body>

    <h1>Edit your Board!</h1>
    {% if row == 0 %}

    <form method="post">
      <label for="title">Enter your category: </label>
      <br>
      <textarea id="title" name="title" rows="30" cols="80"></textarea>
      <br><br>
      <input type="submit" name="sub1">
    </form>

    {% else %}

    <form method="post">
      <label for="title">Enter information for your selected clue: </label>
      <br>
      <input type="text" placeholder="Enter Question" name="question" required>
      <input type="text" placeholder="Enter Point Value" name="points" required>
      <input type="text" placeholder="Enter Correct Answer" name="correct" required>
      <input type="text" placeholder="Enter Incorrect Option" name="wrong1" required>
      <input type="text" placeholder="Enter Incorrect Option" name="wrong2">
      <input type="text" placeholder="Enter Incorrect Option" name="wrong3">
      <br><br>
      <input type="submit" name="sub1">
    </form>

    {% endif %}
  </body>
</html>
